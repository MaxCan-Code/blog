<style>
  @font-face {
    font-family: "APL387";
    src: url("https://dyalog.github.io/APL387/APL387.woff2") format("woff2");
    font-display: swap;
  }
  .markdown-body code,
  .markdown-body pre,
  .markdown-body kbd,
  .markdown-body tt {
    font-family: "APL387", SFMono-Regular, Consolas, monospace;
  }
  :root {
    color-scheme: light dark;
  }
  body {
    color: CanvasText;
    background: Canvas;
  }
  .markdown-body {
    color: inherit;
    background: transparent;
  }
  .markdown-body code,
  .markdown-body pre,
  .highlight {
    background: color-mix(in srgb, Canvas 92%, CanvasText) !important;
    color: CanvasText;
  }
  .markdown-body table tr {
    background-color: Canvas;
    border-top-color: color-mix(in srgb, Canvas 75%, CanvasText);
  }
  .markdown-body table tr:nth-child(2n) {
    background-color: color-mix(in srgb, Canvas 96%, CanvasText);
  }
  .markdown-body table th,
  .markdown-body table td {
    border-color: color-mix(in srgb, Canvas 85%, CanvasText);
  }
  .markdown-body h1,
  .markdown-body h2 {
    border-bottom-color: color-mix(in srgb, Canvas 85%, CanvasText);
  }
  @media (prefers-color-scheme: dark) {
    a { color: #58a6ff; }
    .highlight * {
      color: inherit !important;
    }
    .highlight .gd { background-color: #5c2626 !important; }
    .highlight .gi { background-color: #1f5c2e !important; }
  }
</style>
